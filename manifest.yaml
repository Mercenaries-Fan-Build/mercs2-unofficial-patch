# Mercenaries 2 Unofficial Patch. Each contribution names the BUG-NNN it closes; see verification/
# and README.md. Build: qm build . --out build --corpus <workshop_data/lua>
format: 2

shipment:
  name: mercs2-unofficial-patch
  version: 0.5.0
  target: retail
  authors: [Mercenaries Fan Build]
  description: >-
    Bug fixes for Mercenaries 2: World in Flames — save-integrity, crash and logic defects traced to
    specific code in the decompiled corpus and the retail v1.1 executable. 0.4.0 adds the mesh-emitter
    fire fix (canopies, trees and wrecks render fire again), plus the opt-in console-parity diagnostic
    probe and the winch-magnet-chain restoration seed.
  license: MIT

load:
  # ⚠ m2-sdk is a load-time import: without it the plugin fails to load (0x8007007E) before any code runs.
  requires:
    - { shipment: m2-sdk, version: "^0.5" }

contributions:
  # BUG-001 / BUG-003 — the toolbox counter inflates on reload. One fix in two scripts; BUG-003 makes
  # a dead pass live and must ship with BUG-001. Both targets are `resident` scripts.
  - kind: patch_lua
    target: mrxtaskobjectivedestroy
    append: src/lua/bug_001_toolbox_recount.lua

  - kind: patch_lua
    target: mrxtaskjobcollecttype
    append: src/lua/bug_003_collecttype_loadassets.lua

  # BUG-006 — the hero-swap save/restore hands back a full magazine and full health. Pure T2; carries
  # a second adjacent fix in the same file (see the source header and verification/BUG-006.md).
  - kind: patch_lua
    target: mrxplayer
    append: src/lua/bug_006_heroswap_save_restore.lua


  # T3 — runtime detours in one .asi, one source file per bug (native/). Build it first: qm does not
  # compile native code — `scripts/fetch-sdk.sh && make -C native` (the fetch pulls the pinned
  # m2-sdk release into .sdk/<version>/; `make -C native` auto-runs the fetch if it is missing).
  # `touches` declares each hook twice: by the Lua binding it replaces (`Table.Function`), and by that
  # cfunc's VA in the v11 EXE the plugin arms on (fixpack.h). The VAs are the binding-table slots
  # (the register cites addresses inside the bodies, which are not hookable). CI checks each VA
  # appears in native/src.
  - kind: native_hook
    target: retail
    plugin: src/unofficial_patch.asi
    touches:
      # BUG-004 — the five profile setters that never dirty the autosave flag.
      - Player.SetCash
      - "0x005DF470"
      - Player.SetFuelCapacity
      - "0x005DF710"
      - Player.SetProfileCharacter
      - "0x005DF7C0"
      - Player.SetProfileCostume
      - "0x005DF910"
      - Player.SetAvailableCostumes
      - "0x005DFB30"
      # BUG-008 — Gui.ShowLoadingHints(false) never clears the flag
      - Gui.ShowLoadingHints
      - "0x005B4C20"
      # BUG-009 — Pg.UnloadLayer NULL-derefs on a co-op client
      - Pg.UnloadLayer
      - "0x005D4E30"
      # BUG-014 — the billboard-tree Z-prepass loop, found by signature (m2_render.h) in every build:
      # declared at its VA in each reference build, v1.1 then v1.0.
      - "bug_014:tree_zpass_loop"
      - "0x004A3EA0"
      - "bug_014:tree_zpass_loop_v10"
      - "0x004A3E40"
      # FEATURE-003 — winch magnet chain visual (seed form). Owns both the Havok-chain hook and
      # the AttachCargoToWinch Lua cfunc so the probe can be disabled independently without
      # losing winch telemetry. See verification/FEATURE-003.md.
      - "feature_003:havok_chain"
      - "0x00444030"
      - "feature_003:attach_cargo_to_winch"
      - "0x005D1FD0"
      # FEATURE-004 — mesh-emitter fire visuals. Four patch sites: A overwrites 3 bytes in-place
      # (hidden-node flag); B and C patch the 5-byte `call` operand at the named sites so the
      # game dispatches through our thunks. See verification/FEATURE-004.md for the proofs.
      - "feature_004:hidden_node_flag"
      - "0x004D2C3A"
      - "feature_004:walker_call"
      - "0x0048ADBF"
      - "feature_004:emit_call"
      - "0x0048FED8"
      - "feature_004:area_call"
      - "0x004787D4"

  # Per-fix switches the .asi reads at startup; ships beside the plugin.
  - kind: place_file
    file: src/unofficial_patch.ini
    dest: scripts
