# Mercenaries 2 Unofficial Patch — one Shipment, every confirmed fix.
#
# The backlog this ships against is the bug register. Each contribution below names the BUG-NNN it
# closes, and each Lua append carries the full "what the player sees / why / the fix" note in its own
# file — so a reader can go from a symptom to the exact code without leaving the repo.
#
# Layers:
#   T2 (Lua)  — `patch_lua` appends, in this WAD.
#   T3 (code) — runtime detours in one `.asi`; see native/. Added as a `native_hook` when built.
#   T1 (text) — ships SEPARATELY as `English-patch.wad`. Not expressible here: the engine mounts
#               `<stem>-patch.wad` per base WAD, so one file cannot occupy both the vz and the
#               English slot — and the English slot is the one that wins in BOTH the front end and
#               gameplay.
#
# Build:  qm build . --out build --corpus <workshop_data/lua>
format: 1

shipment:
  name: mercs2-unofficial-patch
  version: 0.1.0
  target: retail
  authors: [Mercenaries Fan Build]
  description: >-
    Bug fixes for Mercenaries 2: World in Flames — save-integrity, crash and logic defects traced to
    specific code in the decompiled corpus and the retail executable.
  license: MIT

contributions:
  # ── BUG-001 / BUG-003 — the toolbox counter inflates on reload ──────────────────────────────────
  #
  # These two are ONE fix in two files, because the defects are in two different scripts. BUG-003
  # makes a dead de-duplication pass live, which produces MORE of the spurious deaths BUG-001 guards
  # against — so shipping either alone is worse than shipping neither.
  #
  # ⚠ Both targets are `resident` scripts, not `vz`. That needed `qm` to learn the resident block
  # first: `patch_lua` reached only `scripts_vz` before this fix pack.
  - kind: patch_lua
    target: mrxtaskobjectivedestroy
    append: src/lua/bug_001_toolbox_recount.lua

  - kind: patch_lua
    target: mrxtaskjobcollecttype
    append: src/lua/bug_003_collecttype_loadassets.lua

  # ── BUG-006 — the hero-swap save/restore hands back more than it was given ──────────────────────
  #
  # Pure T2 after all. The register filed this as possibly needing an exe patch because no shipped
  # script calls a clip-ammo binding — but the binding exists: `Weapon.GetClipAmmo` (0x005EA5F0) and
  # `SetClipAmmo` (0x005EA520) are real cfuncs in the retail `Weapon` table (9 entries @ 0x00B98860).
  # Nothing in the game ever called them.
  #
  # Carries a second, adjacent fix in the same file: `SaveSingleton` saved `GetMaxHealth` rather than
  # `GetHealth`, so a swap was also a free full heal. Same function, and an append can only redefine
  # it once — so the two cannot be separated into two files without one silently erasing the other.
  - kind: patch_lua
    target: mrxplayer
    append: src/lua/bug_006_heroswap_save_restore.lua
