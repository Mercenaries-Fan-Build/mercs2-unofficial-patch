# OVERWRITING existing game content.
#
# Keeps the game's asset hash and replaces what it resolves to. Your overlay WAD is mounted after
# the base WADs and wins the lookup — the base WAD is never modified, so uninstalling is deleting
# one file.
#
# Build:  qm build . --out build
format: 1
shipment:
  name: overwrite-a-texture
  version: 1.0.0
  target: retail
  description: Replaces one hero texture.

contributions:
  - kind: replace_texture
    target: pmc_hum_mattias_v3_ub
    image: src/skin.png
