# ADDING content that did not exist before.
#
# Mints a NEW asset hash rather than replacing one, so nothing in the base game changes. Two
# Shipments adding different names never conflict.
#
# The geometry here is a placeholder cube written by hand (src/model.gltf + src/model.bin) so this
# example builds with no external tools. Export your own from Blender as .glb and point `model:` at
# it — .gltf with a base64 `data:` buffer is rejected, so use binary .glb or keep the .bin sidecar.
#
# Build:  qm build . --out build
format: 1
shipment:
  name: add-new-content
  version: 1.0.0
  target: retail
  description: Adds a new model asset.

contributions:
  - kind: add_model
    name: my_custom_prop
    model: src/model.gltf

    # The donor supplies the rig, materials and state machine your geometry is injected against.
    # It is READ, never written, so many Shipments may borrow the same one.
    #
    # Required: auto-pick is not implemented, and a wrong donor fails quietly rather than loudly.
    # Pick one whose shape matches what you are making.
    donor: oc_veh_helicopter_md500
