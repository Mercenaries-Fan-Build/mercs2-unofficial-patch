# RAW — the open lower bound.
#
# For shipping bytes there is no typed kind for. You hand over a finished block and DECLARE what it
# touches; the Quartermaster cannot read your intent out of opaque bytes, so it takes your word for
# the blast radius and holds you to it.
#
# `touches` must match the payload's own entry table EXACTLY, in both directions:
#
#   * claiming something the payload does not carry mints an ASET row pointing at an asset that is
#     not there — the lookup resolves, the block loads, the asset is absent
#   * carrying something you did not claim gets no row at all (a silent world-load wedge) and is
#     invisible to conflict detection, so it would overwrite another Shipment without anyone noticing
#
# Neither is recoverable downstream, which is why both are refused up front.
#
# Merge class is EXCLUSIVE. We cannot tell replacement from addition in bytes we cannot read, so raw
# never silently co-installs. That is the fail-closed default the whole format runs on.
#
# The payload must be a decompressed patch block — `[u32 count][count x 16-byte rows][containers...]`
# — not a bare container. Hand over a container and the loader reads its `UCFX` magic as an entry
# count. The Quartermaster runs the engine's own reader over it and refuses by name if it will not
# survive that.
#
# src/payload.block here is a synthetic 64x64 DXT1 texture block with zeroed mip data, generated so
# this example is reproducible and carries no game content. In real use it would be whatever block
# you built — for example a state-machine edit, which has no typed kind yet (see
# ../08-not-supported-yet).
#
# Build:  qm build . --out build      (needs qm > v0.10.1)
format: 1
shipment:
  name: raw-bytes
  version: 1.0.0
  target: retail
  description: Ships a hand-built block with a declared blast radius.

contributions:
  - kind: raw
    description: A hand-built texture block, shipped verbatim.
    payload: src/payload.block

    # data | script | code | runtime. Only `data` lowers today: a finished scripts block would
    # shadow every other Shipment's Lua last-mounted-wins, which is exactly what patch_lua exists to
    # avoid (see ../04-bundle-lua).
    target_layer: data

    # A name or a bare hash — both resolve. This one is the asset the payload actually carries.
    touches: ["example_raw_texture"]
