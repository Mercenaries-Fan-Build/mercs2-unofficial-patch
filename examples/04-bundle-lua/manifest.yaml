# BUNDLING LUA — and why you ship an append rather than a script.
#
# Scripts do not load individually. All 114 live in ONE block, so editing one means re-emitting all
# of them. If every mod shipped its own copy of that block, the last one installed would erase every
# other mod's Lua — silently, with no error anywhere.
#
# So you declare an APPEND. At deploy, `qm link` concatenates every installed Shipment's appends
# onto the base script, compiles once, and emits a single WAD mounted last.
#
# Build:  qm build . --out build --corpus <corpus>
#
# `--corpus` is the decompiled game scripts — the base source your text is appended to. Get it from
# mercs2-workshop-data.zip on the tools release page and point at `workshop_data/lua`.
format: 1
shipment:
  name: bundle-lua
  version: 1.0.0
  target: retail
  description: Appends Lua to a game script.

contributions:
  - kind: patch_lua
    # Only scripts whose composition has actually been reverse-engineered can be merged safely.
    # `wifpmcinterior` (the wardrobe) is the one on that list today. Any other script still works,
    # but your Shipment becomes EXCLUSIVE — see ../05-what-the-linter-catches/unmergeable-script.
    target: wifpmcinterior
    append: src/append.lua
