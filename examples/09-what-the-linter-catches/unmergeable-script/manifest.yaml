# WARNS ON PURPOSE — M0141. Still exit 0: this builds, it just costs you compatibility.
#
# Only scripts whose composition has been reversed can be merged. For anything else the Quartermaster
# FAILS CLOSED and marks the claim exclusive, so your Shipment refuses to install alongside another
# that patches the same script.
#
# That is the deliberate trade: refusing to co-install is recoverable and visible. Two mods silently
# annihilating each other's Lua is neither.
#
# ⚠ Note the target is a `vz` script. Game scripts live in several blocks — `vz`, `resident`, `shell`
# — and `patch_lua` targets the `vz` one. Naming a script from another block (`mrxhq`, say) lints
# clean and then fails the build with "not in this scripts block", which is a different problem from
# the one this example is about.
format: 1
shipment: { name: unmergeable-script, version: 1.0.0, target: retail }
contributions:
  - kind: patch_lua
    target: wifmissionflow
    append: src/append.lua
