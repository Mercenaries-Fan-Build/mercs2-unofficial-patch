name: Lint

on:
  push:
  pull_request:
  workflow_dispatch:

# The version of `qm` this Shipment is checked against. Bump it to pick up new rules.
#
# There is no digest to bump alongside it: the expected sha256 is read from GitHub's own record of
# the release asset, which is the same thing you would be copying by hand — so pinning it here would
# add a second place to get out of date without adding any assurance.
#
# ⚠ v0.11.0 is the FLOOR, and both halves of that matter:
#
#   - `place_file` places the plugin's .ini. An older `qm` cannot even PARSE the manifest
#     ("unknown variant `place_file`") — a LINT failure, not a build one. (Landed in v0.10.3.)
#   - reaching the `resident` scripts block. Every Lua target here is a resident module. v0.10.3
#     LINTS this Shipment fine — lint is hermetic and resolves no script — but `qm build` on it
#     fails with "not in this scripts block".
#
# So pinning to something that merely lints would keep CI green while the build stayed broken for
# anyone who tried it. v0.11.0 is the first release that does both; verified by building this
# Shipment with the released binary, resident links and all.
env:
  QM_VERSION: v0.11.0

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # `submodules: recursive` is required: the plugin links against the m2 SDK, which lives in
      # sdk/. Without it the build below fails on a missing header rather than on anything real.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # `qm` ships as a prebuilt binary, so nothing here needs a Rust toolchain.
      - name: Install qm
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo=Mercenaries-Fan-Build/mercs2-wad-simulator
          asset=qm-linux-x86_64

          # GitHub records a sha256 for every release asset. Read it BEFORE downloading, so the
          # check is against what the release claims to hold rather than against the bytes that
          # happened to arrive.
          want=$(gh api "repos/$repo/releases/tags/$QM_VERSION" \
            --jq ".assets[] | select(.name == \"$asset\") | .digest")
          if [ -z "$want" ]; then
            echo "::error::$asset is not in $QM_VERSION — check the version pin in this workflow"
            exit 1
          fi
          want=${want#sha256:}

          gh release download "$QM_VERSION" --repo "$repo" --pattern "$asset" --output qm
          got=$(sha256sum qm | cut -d' ' -f1)
          if [ "$want" != "$got" ]; then
            echo "::error::$asset failed verification — expected $want, got $got"
            exit 1
          fi
          echo "qm $QM_VERSION verified: $got"
          chmod +x qm

      # ★ The plugin has to be BUILT before qm can lint the manifest that references it.
      #
      # `unofficial_patch.asi` is a build artifact and is gitignored — committing a binary is how a
      # consumer ends up shipping a stale one. So `native_hook`'s `plugin:` path does not exist in a
      # fresh checkout, and qm reports M0110 (the file does not exist) as an ERROR, which is correct
      # of it.
      #
      # Building here is not a workaround; it is the coverage we were missing. Every push now proves
      # the SDK compiles for the 32-bit target, the plugin compiles against it, and the result really
      # imports m2-sdk.dll rather than having silently linked its own copy.
      - name: Install the 32-bit MinGW cross-compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-i686

      - name: Build the m2 SDK and the plugin
        run: |
          set -euo pipefail
          make -C sdk build
          make -C native verify

      # Hermetic: no game install, no retail WADs, no network beyond fetching qm. That is what lets
      # this run on a public runner at all — the rules needing the game are a separate set that runs
      # during `qm build`.
      #
      # Gated on the EXIT CODE, not on what gets printed.
      #
      # M0141 warnings are EXPECTED here: these scripts are not on qm's mergeable allow-list, so the
      # Shipment claims them exclusively rather than risking two mods silently erasing each other's
      # Lua. That is the correct outcome for a fix pack, and warnings do not fail the build.
      - name: Lint this Shipment
        run: ./qm lint .

      # A manifest pointing at a path someone renamed should not survive to a release.
      - name: The manifest's declared sources exist
        run: |
          set -euo pipefail
          for f in src/lua/*.lua src/unofficial_patch.ini native/Makefile native/src/main.c; do
            [ -f "$f" ] || { echo "::error::missing $f"; exit 1; }
          done
          grep -q 'plugin: src/unofficial_patch.asi' manifest.yaml \
            || { echo "::error::manifest no longer points at src/unofficial_patch.asi"; exit 1; }
          echo "manifest sources present"

      # Every address the manifest CLAIMS must exist in the plugin source. Without this the `touches`
      # list rots silently — and it is what the conflict system uses to notice two plugins hooking
      # one address, so a stale entry is worse than no entry.
      #
      # One-directional on purpose: the source also defines data addresses it only READS (singletons
      # like the profile and gui pointers), and those are not hook claims.
      - name: Every declared hook address exists in the source
        run: |
          set -euo pipefail
          norm() { grep -oiE '0x[0-9a-f]+' | tr '[:lower:]' '[:upper:]' | sed 's/^0X/0x/' | sort -u; }
          grep -rhoE '0x[0-9A-Fa-f]{6,8}' native/src/*.c | norm > /tmp/in_code
          grep -oE '^[[:space:]]+- "0x[0-9A-Fa-f]+"' manifest.yaml | norm > /tmp/declared
          missing=$(comm -23 /tmp/declared /tmp/in_code || true)
          if [ -n "$missing" ]; then
            echo "::error::manifest declares hook addresses absent from native/src:"
            echo "$missing"
            exit 1
          fi
          echo "all $(wc -l < /tmp/declared | tr -d ' ') declared hook addresses appear in the source"

      - name: What was checked
        if: always()
        run: ./qm rules
