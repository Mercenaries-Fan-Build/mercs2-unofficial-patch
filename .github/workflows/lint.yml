name: Lint

on:
  push:
  pull_request:
  workflow_dispatch:

# ⚠ v0.11.0 floor: older qm cannot parse `place_file` (lint failure) or build the `resident` block.
env:
  QM_VERSION: v0.11.0

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # the plugin links against the m2 SDK in sdk/

      - name: Install qm
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo=Mercenaries-Fan-Build/mercs2-wad-simulator
          asset=qm-linux-x86_64

          # Read the release's recorded sha256 before downloading, then verify the bytes against it.
          want=$(gh api "repos/$repo/releases/tags/$QM_VERSION" \
            --jq ".assets[] | select(.name == \"$asset\") | .digest")
          if [ -z "$want" ]; then
            echo "::error::$asset is not in $QM_VERSION — check the version pin in this workflow"
            exit 1
          fi
          want=${want#sha256:}

          gh release download "$QM_VERSION" --repo "$repo" --pattern "$asset" --output qm
          got=$(sha256sum qm | cut -d' ' -f1)
          if [ "$want" != "$got" ]; then
            echo "::error::$asset failed verification — expected $want, got $got"
            exit 1
          fi
          echo "qm $QM_VERSION verified: $got"
          chmod +x qm

      # The plugin (a gitignored artifact) must be built before qm can lint the manifest that
      # references it, and building here also proves the SDK + plugin compile for the 32-bit target.
      - name: Install the 32-bit MinGW cross-compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-i686

      - name: Build the m2 SDK and the plugin
        run: |
          set -euo pipefail
          make -C sdk build
          make -C native verify

      # Hermetic: no game, no WADs. ⚠ M0141 warnings are expected (these scripts are claimed
      # exclusively, not mergeable) and do not fail the build.
      - name: Lint this Shipment
        run: ./qm lint .

      - name: The manifest's declared sources exist
        run: |
          set -euo pipefail
          for f in src/lua/*.lua src/unofficial_patch.ini native/Makefile native/src/main.c; do
            [ -f "$f" ] || { echo "::error::missing $f"; exit 1; }
          done
          grep -q 'plugin: src/unofficial_patch.asi' manifest.yaml \
            || { echo "::error::manifest no longer points at src/unofficial_patch.asi"; exit 1; }
          echo "manifest sources present"

      # Every manifest `touches` address must exist in the plugin source. One-directional: the source
      # also reads data addresses (singletons) that are not hook claims.
      - name: Every declared hook address exists in the source
        run: |
          set -euo pipefail
          norm() { grep -oiE '0x[0-9a-f]+' | tr '[:lower:]' '[:upper:]' | sed 's/^0X/0x/' | sort -u; }
          grep -rhoE '0x[0-9A-Fa-f]{6,8}' native/src/*.c | norm > /tmp/in_code
          grep -oE '^[[:space:]]+- "0x[0-9A-Fa-f]+"' manifest.yaml | norm > /tmp/declared
          missing=$(comm -23 /tmp/declared /tmp/in_code || true)
          if [ -n "$missing" ]; then
            echo "::error::manifest declares hook addresses absent from native/src:"
            echo "$missing"
            exit 1
          fi
          echo "all $(wc -l < /tmp/declared | tr -d ' ') declared hook addresses appear in the source"

      - name: What was checked
        if: always()
        run: ./qm rules
