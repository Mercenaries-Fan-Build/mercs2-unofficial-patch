name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, X.Y.Z (no leading v)"
        required: true
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  stamp-and-release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          submodules: recursive   # the plugin links against the m2 SDK in sdk/

      - name: Normalise and validate the version
        id: v
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::'$VERSION' is not an X.Y.Z version"; exit 1 ;;
          esac
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "::error::tag v$VERSION already exists — pick a new version"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Stamp shipment.version in manifest.yaml
        run: |
          set -euo pipefail
          VERSION="${{ steps.v.outputs.version }}"
          sed -i "0,/^[[:space:]]*version:/s/^\([[:space:]]*\)version:.*/\1version: $VERSION/" manifest.yaml
          got=$(sed -n 's/^[[:space:]]*version:[[:space:]]*\([^[:space:]#]*\).*/\1/p' manifest.yaml | head -1)
          [ "$got" = "$VERSION" ] || { echo "::error::stamp failed — manifest reads '$got'"; exit 1; }

      - name: Install the 32-bit MinGW cross-compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-i686

      - name: Build the m2 SDK and the plugin
        run: |
          set -euo pipefail
          make -C sdk build
          make -C native verify

      - name: Package the shipment source tree (with the built plugin)
        id: pkg
        run: |
          set -euo pipefail
          ASSET="mercs2-unofficial-patch-v${{ steps.v.outputs.version }}.zip"
          test -f src/unofficial_patch.asi || { echo "::error::plugin not built — refusing to package"; exit 1; }
          zip -r "$ASSET" manifest.yaml src native verification README.md LICENSE -x 'build/*' '*/build/*'
          unzip -l "$ASSET" | grep -q 'src/unofficial_patch.asi' || { echo "::error::asset is missing the plugin"; exit 1; }
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"

      - name: Commit the stamp, tag it, and cut the release with the asset attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.v.outputs.version }}"
          ASSET="${{ steps.pkg.outputs.asset }}"
          BRANCH="${{ github.event.repository.default_branch }}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- manifest.yaml; then
            echo "manifest already at $VERSION — tagging the current commit"
          else
            git add manifest.yaml
            git commit -m "CI: stamp manifest version to $VERSION for release v$VERSION"
            git push origin "HEAD:$BRANCH"
          fi
          git tag "v$VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" --title "v$VERSION" --generate-notes \
            --target "$(git rev-parse HEAD)" "$ASSET"

  guard-and-attach:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: manifest.yaml version must equal the tag
        id: v
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          MAN=$(sed -n 's/^[[:space:]]*version:[[:space:]]*\([^[:space:]#]*\).*/\1/p' manifest.yaml | head -1)
          if [ "$TAG" != "$MAN" ]; then
            echo "::error::tag v$TAG but manifest.yaml says $MAN. Use the dispatch path, or bump manifest.yaml to $TAG before tagging."
            exit 1
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

      - name: Install the 32-bit MinGW cross-compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-i686

      - name: Build the m2 SDK and the plugin
        run: |
          set -euo pipefail
          make -C sdk build
          make -C native verify

      - name: Package the shipment source tree (with the built plugin)
        id: pkg
        run: |
          set -euo pipefail
          ASSET="mercs2-unofficial-patch-v${{ steps.v.outputs.version }}.zip"
          test -f src/unofficial_patch.asi || { echo "::error::plugin not built — refusing to package"; exit 1; }
          zip -r "$ASSET" manifest.yaml src native verification README.md LICENSE -x 'build/*' '*/build/*'
          unzip -l "$ASSET" | grep -q 'src/unofficial_patch.asi' || { echo "::error::asset is missing the plugin"; exit 1; }
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"

      - name: Create the release if absent, or attach the asset to an existing one
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          ASSET="${{ steps.pkg.outputs.asset }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" --title "$TAG" --generate-notes "$ASSET"
          fi
