# Mercenaries 2 unofficial patch — per-fix switches.
#
# Every fix is ON by default: someone who installed a fix pack wants the fixes, and a fix nobody
# enables is a fix nobody tests.
#
# Set a key to 0 to disable that fix without rebuilding or uninstalling anything. That matters for
# two reasons: a detour that misbehaves on your machine can be switched off in isolation, and when
# something does go wrong, bisecting by fix is the fastest way to find which one.
#
# Each id matches an entry in the bug register and a source file in native/src/. Results are logged
# to unofficial_patch.log next to this file — check there first if a fix seems inactive.

# Profile changes to cash, fuel capacity, character, costume, or the costume roster are not picked
# up by the autosave when nothing else changed. Five setters never mark the profile dirty.
BUG_004 = 1

# Three PDA blip binders dereference NULL on a stale or out-of-range blip id. Crash, not a glitch.
BUG_007 = 1

# Gui.ShowLoadingHints(false) is a one-way switch: the flag is written in exactly one place, so
# hints can be turned on but never off.
BUG_008 = 1

# Pg.UnloadLayer dereferences NULL on a co-op CLIENT when no game state is current.
BUG_009 = 1

# NOT SHIPPED YET — BUG-005 and BUG-011 have no key here because they have no fix here.
#
# Both are real and confirmed, but neither can be written correctly from static evidence, and a
# detour built on a guess corrupts a live process rather than just failing. Each is blocked on one
# named observation; see native/src/fixpack.h and verification/.
