# log guides where to attach). Set to 1 if you're helping us gather the captures named in
# verification/PROBE-001.md.
PROBE_001 = 0
FEATURE_003 = 0
# Mesh-emitter fire fix: canopies, trees and wrecks whose fire emitter is a mesh type have an
# empty per-triangle area at submesh+0x15C on PC, so the walker computes area 0 and emits 0
# particles. Three gated remedies (A: hidden-node flag at 0x4D2C3A; B: zero-area walker return
